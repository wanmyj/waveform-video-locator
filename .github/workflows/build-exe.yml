name: Build exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to use run number.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "value=${{ github.event.inputs.tag || format('build-{0}', github.run_number) }}" >> "$GITHUB_OUTPUT"
      - run: npx pkg . --output "dist/soundwave-${{ steps.tag.outputs.value }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: soundwave-exe
          path: dist/soundwave-${{ steps.tag.outputs.value }}.exe
      - name: Publish to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          gh release create "$TAG" "dist/soundwave-$TAG.exe" --title "$TAG" --notes "Automated build" --repo "$GITHUB_REPOSITORY"
